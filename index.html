<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tina Talks | Your Story Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Bodoni+Moda:ital,wght@1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#101012;--gold:#EBBA4D;--pink:#F2668F;--purple:#A078FF;--text:#f4f1e9;--muted:#c1beb7;--dim:#9a968f;--line:rgba(244,241,233,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(50% 55% at 85% 10%,rgba(160,120,255,.13),transparent 70%),radial-gradient(45% 50% at 5% 100%,rgba(242,102,143,.10),transparent 70%);pointer-events:none}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:0 28px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{height:50px;width:auto;display:block}
.hdr{display:flex;align-items:center;gap:26px}
.hdtag{font:italic 400 17px "Playfair Display",Georgia,serif;color:var(--muted);white-space:nowrap}.hdtag em{color:var(--pink)}
.burger{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-content:center;gap:5px}
.burger i{display:block;width:18px;height:1.5px;background:var(--text);transition:.2s}.burger:hover{border-color:var(--gold)}
.bar3{display:grid;grid-template-columns:6fr 2fr 6fr;gap:4px;height:3px}.bar3 div{background:var(--line);height:3px}.bar3 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .4s}
main{position:relative;max-width:1180px;margin:0 auto;padding:0 28px}
.screen{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mono{font-family:Inter,sans-serif;text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:500}
.eyebrow{color:var(--gold);display:flex;align-items:center;gap:14px}.eyebrow::before{content:"";width:44px;height:1px;background:var(--gold)}
.eyebrow.p{color:var(--pink)}.eyebrow.p::before{background:var(--pink)}.eyebrow.v{color:var(--purple)}.eyebrow.v::before{background:var(--purple)}
h1{margin-top:22px;font-family:"Playfair Display",Georgia,serif;font-size:clamp(40px,6vw,68px);font-weight:500;line-height:1.08;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;color:var(--pink)}
.lede{margin-top:24px;font-weight:300;font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;min-width:210px;padding:0 40px;border-radius:999px;border:0;cursor:pointer;font:700 14px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:transform .2s,box-shadow .2s,opacity .2s}
.btn.gold{background:linear-gradient(135deg,#f3c966,#EBBA4D 55%,#e6a93a);color:#0b0b0c;box-shadow:0 0 0 4px rgba(235,186,77,.16),0 12px 34px -8px rgba(235,186,77,.7)}
.btn.gold:hover{transform:translateY(-2px)}
.btn.line{background:none;border:1px solid rgba(235,186,77,.55);color:var(--gold)}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{margin-top:48px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--dim);cursor:pointer;font:700 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:12px 4px}.back:hover{color:var(--text)}
/* question pages */
.qwrap{max-width:1100px;margin:0 auto;padding:clamp(44px,9vh,96px) 0 220px}
.qwrap h2{max-width:1040px;margin-top:18px;font:700 clamp(30px,4.6vw,54px)/1.08 Inter,system-ui,sans-serif;letter-spacing:-.045em;color:var(--text)}
.qwrap h2 em{font:italic 500 1.04em "Bodoni Moda","Playfair Display",Georgia,serif;letter-spacing:0;color:var(--pink)}
.hint{margin-top:16px;font-size:clamp(16px,1.6vw,19px);color:var(--muted);font-weight:300;max-width:720px}
.plabel{margin-top:56px;font:600 13px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--pink)}
.plabel+.opts{margin-top:18px}
.opts{margin-top:38px;display:grid;gap:14px}
.opts.g2{grid-template-columns:1fr}
@media(min-width:780px){.opts.g2{grid-template-columns:1fr 1fr}.opts.g5{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.opts:not(.g2):not(.g5):not(.g3){grid-template-columns:repeat(auto-fit,minmax(470px,1fr))}}
.opt{display:flex;gap:18px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;color:var(--text);font:400 clamp(16.5px,1.5vw,19px)/1.45 Inter,sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(235,186,77,.55)}
.opt .k{flex:none;width:24px;height:24px;border:1.5px solid var(--dim);border-radius:50%;display:grid;place-items:center}
.opt.chk .k{border-radius:7px}
.opt.sel{border-color:var(--gold);background:rgba(235,186,77,.08);box-shadow:0 0 0 1px var(--gold) inset}
.opt.sel .k{background:var(--gold);border-color:var(--gold)}.opt.sel .k::after{content:"";width:9px;height:9px;background:#0b0b0c;border-radius:50%}
.opt.chk.sel .k::after{border-radius:2px}
.scale{margin-top:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.scale .opt{justify-content:center;padding:26px 0;font:700 24px Inter,sans-serif}
.scale-l{display:flex;justify-content:space-between;margin-top:12px;color:var(--dim);font-size:14px}
.sub{margin-top:22px;color:var(--dim)}
textarea,input[type=text],input[type=email],input[type=tel]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;color:var(--text);font:400 18px/1.5 Inter,sans-serif;outline:0;resize:vertical}
textarea{margin-top:22px;min-height:110px}textarea.big{min-height:230px}
input{margin-top:14px}
textarea:focus,input:focus{border-color:var(--gold)}
.mirror{margin-top:20px;min-height:1.5em;font:italic 400 clamp(17px,1.8vw,21px)/1.45 "Playfair Display",Georgia,serif;color:var(--pink);opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.mirror.on{opacity:1;transform:none}.mirror em{color:var(--gold)}
.consent{margin-top:26px}
.fine{margin-top:18px;color:var(--dim);font-size:13.5px;max-width:640px}
/* signature strip */
.fw{position:fixed;left:0;right:0;bottom:34px;z-index:30;display:flex;justify-content:flex-end;align-items:flex-end;gap:22px;padding:18px max(28px,calc((100vw - 1180px)/2 + 28px)) 10px;background:linear-gradient(rgba(11,11,12,0),rgba(11,11,12,.96) 45%);pointer-events:none}
.fw[hidden]{display:none}.fw .avb{pointer-events:auto}
.fw .sq{align-self:center;margin-bottom:10px;font:italic 400 clamp(15px,1.3vw,19px)/1.4 "Playfair Display",Georgia,serif;color:var(--text);text-align:right;max-width:620px}
.avc{display:flex;flex-direction:column;align-items:center}
.avb{position:relative;width:62px;height:62px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 8px 30px rgba(0,0,0,.6),0 0 34px rgba(235,186,77,.45),0 0 60px rgba(242,102,143,.25)}
.avb img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block}
.avb i{position:absolute;right:2px;bottom:2px;width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid #0b0b0c}
.ss{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}.sign{font:400 28px/1 Allura,"Brush Script MT",cursive;color:var(--gold)}.wy{font:italic 400 11.5px "Playfair Display",Georgia,serif;color:var(--pink);margin-top:-1px}
@media(max-width:979px){
 .fw{flex-direction:column;align-items:flex-end;gap:10px;left:auto;background:none;padding:0 14px 46px}
 .fw .sq{width:min(86vw,320px);text-align:left;margin:0;padding:16px 20px;border-radius:22px 22px 6px 22px;background:rgba(18,16,20,.97);border:1px solid rgba(235,186,77,.28);font-size:15px;transition:opacity .25s,transform .25s}
 .fw.closed .sq{opacity:0;transform:translateY(10px);pointer-events:none;visibility:hidden}
 .fw .ss{display:none}.avb{width:56px;height:56px}
 .row.stick{position:sticky;bottom:44px;margin-top:30px;padding:14px 72px 12px 0;background:linear-gradient(rgba(11,11,12,0),var(--bg) 38%);z-index:6}
 .hdtag{display:none}
}
.proto{display:none;position:fixed;left:0;right:0;bottom:0;height:34px;z-index:40;background:#17142a;border-top:1px solid var(--purple);color:var(--muted);font:400 12px Inter,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px}
/* hero */
.hero{display:grid;gap:40px;padding:clamp(36px,7vh,80px) 0 200px;align-items:center}
@media(min-width:980px){.hero{grid-template-columns:1.2fr .8fr;gap:72px}}
.flow{max-width:600px}.flow p{font-weight:300;font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--muted);margin-top:16px}
.flow .stmt{margin:26px 0;font:400 clamp(24px,3vw,30px)/1.25 "Playfair Display",Georgia,serif;color:var(--text)}.flow .stmt em{color:var(--gold);font-style:italic}
.st{font-style:italic;color:var(--pink);font-family:"Playfair Display",Georgia,serif;font-size:1.12em}
.steps{list-style:none;margin-top:26px;display:flex;gap:10px 24px;flex-wrap:wrap;color:var(--dim);font:400 13px Inter,sans-serif}.steps li{display:flex;align-items:center;gap:8px}.steps b{display:grid;place-items:center;width:20px;height:20px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font:500 11px Inter,sans-serif}
.hr{position:relative;justify-self:center;width:min(100%,420px);isolation:isolate}
.hr::before{content:"";pointer-events:none;position:absolute;inset:-14% -18%;background:radial-gradient(closest-side,rgba(235,186,77,.22),rgba(242,102,143,.16) 45%,rgba(160,120,255,.14) 70%,transparent);filter:blur(30px);z-index:-1}
.arch{position:relative;overflow:hidden;border:1px solid rgba(235,186,77,.45);box-shadow:0 0 50px rgba(235,186,77,.4),0 0 110px rgba(242,102,143,.3),0 0 190px rgba(160,120,255,.35)}
.arch img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 22%}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(11,11,12,.55))}
.cap{margin-top:16px;text-align:center;font:italic 400 20px "Playfair Display",Georgia,serif;color:var(--muted)}.cap em{color:var(--pink)}
.role{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font:400 10.5px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.role b{font:600 13px Inter,sans-serif;letter-spacing:.3em;color:var(--gold)}
/* menu */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.menu{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#101012;border-left:1px solid var(--line);z-index:60;transform:translateX(100%);transition:transform .3s;padding:28px 34px;display:flex;flex-direction:column}
body.mo .menu{transform:none}body.mo .veil{opacity:1;pointer-events:auto}
.menu .x{align-self:flex-end;background:none;border:1px solid var(--line);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.menu nav{margin-top:40px;display:grid}
.menu nav a,.menu nav button{display:block;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:22px 0;color:var(--text);text-decoration:none;cursor:pointer;font:400 26px "Playfair Display",Georgia,serif}.menu nav a:hover,.menu nav button:hover{color:var(--gold)}
.menu nav span{display:block;margin-top:4px;font:400 13px Inter,sans-serif;color:var(--dim)}
.menu .sg{margin-top:auto;font:400 34px Allura,cursive;color:var(--gold)}
/* result */
.pc{margin-top:22px;border:1px solid rgba(235,186,77,.3);background:var(--card);border-radius:22px;padding:30px 30px}
.pc.r2{border-color:rgba(242,102,143,.4)}.pc.r3{border-color:rgba(160,120,255,.45)}
.pc .n{font:700 12px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.pc.r2 .n{color:var(--pink)}.pc.r3 .n{color:var(--purple)}
.pc q{display:block;margin-top:12px;padding-left:18px;border-left:2px solid var(--gold);font:italic 500 clamp(20px,2.4vw,26px)/1.4 "Playfair Display",Georgia,serif;color:var(--text);quotes:none}
.pc.r2 q{border-color:var(--pink)}
.pc p{margin-top:14px;font-weight:300;font-size:17.5px;color:var(--muted)}.pc p em{color:var(--gold)}
.pc .row{margin-top:26px}
.res{max-width:820px;margin:0 auto;padding:clamp(44px,8vh,84px) 0 220px}
.admin{margin-top:46px;border:1px solid var(--purple);border-radius:18px;padding:24px;background:rgba(160,120,255,.06)}
.admin dl{display:grid;grid-template-columns:200px 1fr;gap:8px 18px;font-size:14.5px}.admin dt{color:var(--dim)}.admin dd{margin:0}
@media(max-width:700px){.admin dl{grid-template-columns:1fr}}
.gp{margin:10px 0;font-size:15px;line-height:1.6;color:var(--muted)}.gp b,.gp i{color:var(--text)}
.care{list-style:none;margin-top:28px}.care li{padding:18px 0;border-bottom:1px solid var(--line);font-size:19px}.care li span{display:block;color:var(--dim);font-size:14.5px}
.about{max-width:720px;margin:0 auto;padding:clamp(44px,8vh,84px) 0 220px}
.namerow{display:flex;gap:10px;margin-top:14px}.namerow input{margin-top:0;flex:1;min-width:0}.phrow{display:flex;gap:10px;margin-top:14px}.phrow input{margin-top:0;flex:1;min-width:0}.phrow select{flex:none;width:min(190px,42%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;color:var(--text);font:400 17px Inter,sans-serif;outline:0}.phrow select:focus{border-color:var(--gold)}.need{margin-top:6px;color:var(--pink);font-size:14.5px;min-height:1.4em}
.tl{list-style:none;margin-top:34px;display:grid;gap:0}.tl li{display:flex;gap:18px;padding:0 0 26px;position:relative}.tl li:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1px;background:var(--line)}.tl b{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font:500 13px Inter,sans-serif}.tl div{font-weight:300;font-size:17.5px;color:var(--muted)}.tl span{display:block;font:600 11.5px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.book{margin-top:34px;padding:clamp(30px,5vw,48px);border-radius:26px;border:1px solid rgba(235,186,77,.45);background:linear-gradient(135deg,rgba(235,186,77,.10),rgba(160,120,255,.09));box-shadow:0 0 80px -30px rgba(242,102,143,.6);text-align:center}.book .mono{color:var(--gold)}.book h2{margin-top:12px;font:500 clamp(34px,5vw,52px)/1.1 "Playfair Display",Georgia,serif;letter-spacing:-.01em}.book h2 em{font-style:italic;font-weight:400;color:var(--pink)}.book p{margin:14px auto 0;max-width:460px;font-weight:300;font-size:18px;color:var(--muted)}.book .row{justify-content:center;margin-top:28px}

/* ---- feminine polish ---- */
.hr{pointer-events:none}.hr *{pointer-events:none}
:root{--blush:#f7c9d6;--card:#141016}
body::before{background:radial-gradient(60% 55% at 88% 6%,rgba(160,120,255,.20),transparent 70%),radial-gradient(55% 50% at 4% 96%,rgba(242,102,143,.18),transparent 70%),radial-gradient(40% 35% at 50% 40%,rgba(247,201,214,.05),transparent 70%)}
.top{background:linear-gradient(180deg,rgba(24,14,24,.92),rgba(11,11,12,.88));border-bottom:1px solid rgba(242,102,143,.22)}
.top .in{height:84px}.logo{height:62px;filter:drop-shadow(0 4px 18px rgba(242,102,143,.35))}
.bar3 div{background:rgba(247,201,214,.14)}
.eyebrow{color:var(--blush)}.eyebrow::before{background:linear-gradient(90deg,var(--gold),var(--pink));width:54px}
.eyebrow::after{content:"\2726";color:var(--gold);font-size:11px;letter-spacing:0}
h1{font-weight:400}
.arch{border-radius:20px;border:0;padding:0;background:#141416;box-shadow:0 0 0 1px rgba(242,102,143,.4),0 30px 80px -34px rgba(242,102,143,.45)}

.hr::before{opacity:.45}

.opt{border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--card);border:1px solid rgba(247,201,214,.16);box-shadow:0 10px 30px -18px rgba(242,102,143,.5);padding:24px 28px}

 .opts.g2{grid-template-columns:repeat(3,1fr)}

.r2{display:block}
@media(min-width:1000px){
 .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.r2 input[type=email]{margin-top:0}.r2 .phrow{margin-top:0}
 .top .in{height:76px}.logo{height:56px}
 .plabel{margin-top:clamp(14px,2.6vh,36px)}
 textarea{min-height:clamp(60px,8.5vh,100px)}
 .hint{max-width:900px}
 .fine{margin-top:10px}
}

.logob{background:none;border:0;padding:0;cursor:pointer;display:block;line-height:0;transition:transform .2s}.logob:hover{transform:scale(1.03)}
@media(min-width:1000px){.row.stick{width:fit-content;padding-right:28px;gap:22px}}
.oth{margin-top:12px;position:relative}.oth[hidden]{display:none}.oth input{margin-top:0;padding-right:84px}.oth .cnt{position:absolute;right:18px;top:50%;transform:translateY(-50%);font:500 12px Inter,sans-serif;color:var(--dim);letter-spacing:.06em}

/* ---- phone layout ---- */
@media(min-width:520px){
 .hero{grid-template-columns:1.2fr .8fr;column-gap:clamp(22px,4.4vw,72px);row-gap:0;align-items:center;padding-top:clamp(22px,5vh,70px)}
 .hero .hr{order:0;width:100%;max-width:440px;justify-self:center}
}
@media(max-width:760px){
 .hr::before{inset:-6% -2%;filter:blur(22px)}
 .hero .row{position:sticky;bottom:46px;z-index:40;margin-top:22px;padding:12px 0 10px;background:none;isolation:isolate}
 .hero .row .btn{width:100%;justify-content:center}
 .hero{padding-bottom:120px}
}
@media(min-width:520px) and (max-width:760px){
 .hero h1{font-size:clamp(38px,7vw,52px)}
 .hr .role span{font-size:9px;letter-spacing:.14em}
 .hr .cap{font-size:16px}
}
@media(max-width:430px){.hero .row .btn{letter-spacing:.12em;font-size:13px;padding-left:10px;padding-right:10px;white-space:nowrap}}
@media(max-width:519px){
 .hero{display:grid;grid-template-columns:minmax(0,1fr) 38%;column-gap:14px;row-gap:0;padding:20px 0 120px;align-items:start}
 .hero>div:first-child{display:contents}
 .hero .eyebrow{grid-column:1/-1;grid-row:1;margin-bottom:16px}
 .hero h1{grid-column:1;grid-row:2;align-self:center;font-size:clamp(34px,10.6vw,48px);line-height:1.04;margin:0}
 .hero .hr{grid-column:2;grid-row:2;width:100%;order:0;justify-self:stretch}
 .hr .arch{border-radius:16px}
 .hr .arch img{aspect-ratio:1/1.12;object-position:50% 14%}
 .hr .role{margin-top:8px;gap:0}.hr .role b{font-size:13px;letter-spacing:.34em;padding-left:.34em;line-height:1.2}.hr .role span{display:none}
 .hr .cap{display:none}
 .hero .flow,.hero .steps,.hero .row{grid-column:1/-1}
 .hero .flow{margin-top:20px}
}
@media(max-width:760px){
 .qwrap{padding:18px 0 120px}

 .row.stick::before,.hero .row::before{content:"";position:absolute;z-index:-1;inset:0 -32px;background:linear-gradient(rgba(11,11,12,0),var(--bg) 42%);pointer-events:none}
 .fw{z-index:45}.qwrap .row.stick .btn{flex:1;min-width:0;padding-left:12px;padding-right:12px;white-space:nowrap}.qwrap .row.stick .back{flex:none;padding:14px 6px;min-height:46px}

 .opt{font-size:16px;padding:15px 18px}
 .opts{gap:10px;margin-top:18px}
 .scale .opt{padding:15px 0}
 .ebrow .eyebrow{font-size:10px;letter-spacing:.14em}
}

/* ---- phone polish v3: in-flow Next, inline quote, no overscroll ---- */

 .qi img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 20%;box-shadow:0 0 0 2px var(--gold);flex:none}
 .qi p{font:italic 400 15px/1.45 "Playfair Display",Georgia,serif;color:var(--text)}
 .qi small{display:block;font:400 22px/1 Allura,"Brush Script MT",cursive;color:var(--gold);margin-top:2px}
 .row.stick,.qwrap .row.stick{position:static;padding:0;margin-top:22px;background:none;isolation:auto}
 .row.stick::before,.hero .row::before{display:none}
 .hero .row{position:static;padding:0;margin-top:22px}
 .hero{padding-bottom:36px}
 .qwrap{padding-bottom:36px}
}

function desk(c){return `<div class="admin" id="desk" hidden><div class="mono" style="color:var(--purple);margin-bottom:12px">Tina’s desk (prototype only, never shown to her)</div><dl><dt>Name, email, phone</dt><dd>${esc(A.name)} ${esc(A.last)}, ${esc(A.email)}${A.phone?", "+esc(A.phone):""}</dd><dt>Work</dt><dd>${ROLES[A.role]}</dd><dt>Pressure index</dt><dd>${c.p} of 12 (ticks ${c.sc}${c.adds.length?", plus "+c.adds.join(", "):""})</dd><dt>The sentence</dt><dd>${c.L[1]}</dd><dt>Root cause in one line</dt><dd>${esc(c.root)}</dd><dt>Goal for 90 days</dt><dd>${esc(c.goal)||"not given"}</dd><dt>Restore first</dt><dd>${RESTN[c.rest][0]}</dd><dt>Readiness</dt><dd>${READY[A.ready]} · gets in the way: ${OBST[A.obst]}</dd><dt>Cost if nothing changes</dt><dd>${(A.costS||[]).map(j=>COSTS[j].replace(/\.$/,"")).join(", ")||"n/a"}${A.costT?" · “"+esc(A.costT)+"”":""}</dd><dt>Quiet no</dt><dd>${c.grief?"n/a (grief path)":["Yes","No","Not sure"][A.noVoice]||"n/a"}</dd><dt>Anything else</dt><dd>${esc(A.extra)||"nothing added"}</dd><dt>Flags</dt><dd>${c.flags.length?c.flags.join("<br>"):"none"}</dd></dl><div class="mono" style="color:var(--purple);margin:22px 0 10px">${c.ready?"Draft 90-day implementation guide, ready for you to edit":"Draft personal plan, shorter: first steps only (she is not yet ready for the 90-day guide)"}</div><div class="gp"><b>Days 1 to 30 · Reveal.</b> Name the sentence “${c.L[1]}” and where it came from. The truth to hold: <i>${c.L[2]}</i> ${c.goal?"Goal: “"+esc(c.goal)+"”.":""} <i>[Tina: one sentence on what the pattern tells you]</i></div><div class="gp"><b>Days 31 to 60 · Restore: ${RESTN[c.rest][0]}.</b> ${RESTN[c.rest][1]}</div>${c.ready?`<div class="gp"><b>Days 61 to 90 · Rebuild.</b> ${c.grief?"Hold the grief first. <i>[Tina: gentler first-move line for the grief path]</i>":"Your first move on “"+DECS[A.decision].replace(/\.$/,"")+"”: <i>[Tina: one first-move line for this decision]</i> Then run it through the Life by Design Filter."}</div>`:""}</div>`}

function care(final){cur=null;widget();toTop();const c=final?calc():null;m.innerHTML=`<section class="screen"><div class="res"><div class="mono eyebrow p">First, you</div><h1>${esc((A.name||"").trim().split(" ")[0])}, thank you for telling me the truth.</h1><p class="lede">Before anything else, please talk to a real person today. You do not have to carry this alone, and you do not have to be certain about anything to reach out.</p><ul class="care"><li>Samaritans, UK, free, 24 hours<span>Call 116 123</span></li><li>Shout, UK, free text support<span>Text SHOUT to 85258</span></li><li>Befrienders Kenya<span>Call +254 722 178 177</span></li><li>Nigeria: Mentally Aware Nigeria Initiative<span>mentallyaware.org</span></li></ul><p class="lede" style="margin-top:28px">If you are in immediate danger, call your local emergency number now. I have read what you shared. Your plan can wait until you are ready.</p><p class="fine">Draft wording. Tina to rewrite in her own voice. Support numbers to be verified before launch.</p><div class="row">${final?"":`<button class="btn line" onclick="go(${pos+1})">Continue the quiz when I’m ready</button>`}</div>${final?desk(c):""}</div></section>`}
function finish(){pos=FLOW.length;prog();toTop();cur=null;widget();const c=calc();send("complete",{answers:A,summary:{season:SEASON[A.season].replace(/\.$/,"")+(A.seasonT&&A.seasonT.trim()?": "+A.seasonT.trim():""),ready:c.ready,care:A.safety>0,readyLabel:READY[A.ready],obstacle:OBST[A.obst],sentence:c.L[1],source:c.src,goal:c.goal,pressure:c.p,restore:RESTN[c.rest][0],cost:(A.costS||[]).map(j=>COSTS[j].replace(/\.$/,"")).join(", "),flags:c.flags,extra:A.extra||""}});if(A.safety>0)return care(true);
const nm=esc((A.name||"").trim().split(" ")[0]),em=esc(A.email),g=esc(c.goal);
const what=c.ready?`a 90-day implementation guide, with your goal, the steps in order, and the time frame if you follow them`:`your first steps, in order, for the season you are in`;
m.innerHTML=`<section class="screen"><div class="res"><div class="mono eyebrow">Received</div><h1>${nm}, thank you for <em>trusting me</em> with your story.</h1><p class="lede">Your answers are with me now. I will read them myself, and within <b style="color:var(--gold);font-weight:500">48 hours</b> you will receive your personal plan at <em style="color:var(--pink)">${em}</em>.</p><ol class="tl"><li><b>1</b><div><span>Now</span>Your answers are safely with me.</div></li><li><b>2</b><div><span>Within 48 hours</span>Your personal plan arrives by email: ${what}.</div></li><li><b>3</b><div><span>Then</span>You follow it on your own, or we walk it together.</div></li></ol><div class="pc r2"><div class="n">A first reflection, while you wait</div><q>${esc(c.L[1])}</q><p>The truth: <em>${esc(c.L[2])}</em></p></div>${g?`<div class="pc r3"><div class="n">The goal your plan is built around</div><q>${g}</q></div>`:""}<div class="book"><div class="mono">While you wait</div><h2>Five Good <em>Years</em></h2><p>This is where it all began for me. Read it while I read your story.</p><div class="row"><a class="btn gold" href="${BOOK_URL}" target="_blank" rel="noopener">Read Five Good Years</a></div></div><p class="fine">This is a starting point. It is not counselling and not a guarantee.</p><div class="row"><button class="back" onclick="location.reload()">Start again</button></div>${desk(c)}</div></section>`}
